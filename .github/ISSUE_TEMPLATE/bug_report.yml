name: Bug report
description: Something isn't working as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: If it involves a server, say what kind and how it was started, such as `next dev` started by a coding agent.
  - type: input
    id: version
    attributes:
      label: Ports version
      description: Run `ports --version`, or check the release you downloaded.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version, and Apple silicon or Intel
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output of `ports --all`, or a screenshot
      description: Please remove any project names or paths you don't want to share. For security problems, see SECURITY.md instead.
