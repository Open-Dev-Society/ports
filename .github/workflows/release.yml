name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/.*portsVersion = "\(.*\)"/\1/p' Sources/PortsCore/Ports.swift)
          test "v$version" = "$GITHUB_REF_NAME"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Build the disk image and zip
        run: ./scripts/package.sh
      - name: Write the release notes
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} /^\[.*\]: / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md
          cat .github/release-install-note.md >> notes.md
      - name: Sign the update and write the feed
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: ./scripts/appcast.sh "$VERSION"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/Ports-$VERSION.dmg dist/Ports-$VERSION.zip dist/Ports-$VERSION.sha256 dist/appcast.xml"
          # A release that already exists has its files replaced, so a fix can ship under the same link.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Ports $VERSION" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" $files --title "Ports $VERSION" --notes-file notes.md --verify-tag
          fi
